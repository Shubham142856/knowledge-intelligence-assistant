[flake8]
max-line-length = 120
# Ignore noisy errors common in ML repos:
# E402: module level import not at top (common in notebooks/scripts)
# F401: imported but unused (common when setting up imports)
# F811: redefinition of unused (common with mock functions)
# F824: global unused
# W605: invalid escape sequence (common in regex in strings)
# E731: lambda assignment
# F541: f-string without placeholders
extend-ignore = E203, W503, E501, E402, F401, F811, F824, W605, E731, F541
exclude =
    .venv,
    __pycache__,
    .git,
    benchmarks,
    data,
    deploy,
    scripts
